
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registrar Saída | Sistema de Gestão e Redução de Desperdício</title>

  <link rel="stylesheet" href="/public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

  <aside
    id="aside-placeholder"
    class="w-[180px] shrink-0"
  ></aside>

  <div class="flex min-w-0 flex-1 flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-1">

      <div class="w-full px-6 pt-8">

        <!-- Breadcrumb -->
        <div
          class="mb-8 flex min-h-[35px] items-center text-base"
        >
          <span class="text-text-secondary">
            Saídas
          </span>

          <span class="ml-1 font-semibold text-text">
            / Registrar
          </span>
        </div>

        <!-- Card -->
        <section
          class="w-full rounded-md bg-gray-200 px-6 py-5"
        >

          <h1
            class="mb-9 text-base font-semibold text-text"
          >
            Registrar Saída
          </h1>

          <form id="form-registrar-saida">

            <!-- Produto e lote -->
            <div
              class="grid grid-cols-1 gap-8 md:grid-cols-2"
            >

              <!-- Produto -->
              <div class="flex flex-col">

                <label
                  for="produto"
                  class="mb-2 whitespace-nowrap text-xs font-medium text-text"
                >
                  Produto
                  <span class="text-red-600">*</span>
                </label>

                <select
                  id="produto"
                  name="produto"
                  required
                  class="h-[28px] w-full rounded border border-gray-400 bg-primary-light px-3 text-[11px] text-text outline-none"
                >
                  <option value="" selected disabled>
                    Selecione um produto cadastrado
                  </option>

                  <!-- Produtos carregados do banco de dados -->
                </select>

              </div>

              <!-- Lote -->
              <div class="flex flex-col">

                <label
                  for="lote"
                  class="mb-2 whitespace-nowrap text-xs font-medium text-text"
                >
                  Lote
                  <span class="text-red-600">*</span>
                </label>

                <select
                  id="lote"
                  name="lote"
                  required
                  class="h-[28px] w-full rounded border border-gray-400 bg-primary-light px-3 text-[11px] text-text outline-none"
                >
                  <option value="" selected disabled>
                    Selecione um lote disponível
                  </option>

                  <!-- Lotes do produto selecionado carregados do banco -->
                </select>

              </div>

            </div>

            <!-- Quantidades e data da saída -->
            <div class="mt-6 grid grid-cols-1 gap-8 md:grid-cols-3">

              <!-- Quantidade disponível -->
              <div class="flex flex-col">

                <label
                  for="quantidade-disponivel"
                  class="mb-2 whitespace-nowrap text-xs font-medium text-text"
                >
                  Qtd. disponível
                  <span class="text-red-600">*</span>
                </label>

                <input
                  id="quantidade-disponivel"
                  name="quantidade-disponivel"
                  type="text"
                  placeholder="Selecione um lote"
                  readonly
                  required
                  class="h-[28px] w-full rounded border border-gray-400 bg-primary-light px-3 text-[10px] text-text outline-none"
                >

              </div>

              <!-- Quantidade de saída -->
              <div class="flex flex-col">

                <label
                  for="quantidade-saida"
                  class="mb-2 whitespace-nowrap text-xs font-medium text-text"
                >
                  Qtd. de saída
                  <span class="text-red-600">*</span>
                </label>

                <input
                  id="quantidade-saida"
                  name="quantidade-saida"
                  type="text"
                  placeholder="Ex.: 5"
                  required
                  class="h-[28px] w-full rounded border border-gray-400 bg-primary-light px-3 text-[10px] text-text outline-none"
                >

              </div>

              <!-- Data da saída -->
              <div class="flex flex-col">

                <label
                  for="data-saida"
                  class="mb-2 whitespace-nowrap text-xs font-medium text-text"
                >
                  Data da saída
                  <span class="text-red-600">*</span>
                </label>

                <input
                  id="data-saida"
                  name="data-saida"
                  type="date"
                  required
                  class="h-[28px] w-full rounded border border-gray-400 bg-primary-light px-3 text-[10px] text-text outline-none"
                >

              </div>

            </div>

            <!-- Motivo -->
            <div class="mt-5 w-[31%]">

              <label
                for="motivo"
                class="mb-2 block text-xs font-medium text-text"
              >
                Motivo
                <span class="text-red-600">*</span>
              </label>

              <select
                id="motivo"
                name="motivo"
                required
                class="h-[52px] w-full rounded border border-gray-400 bg-primary-light px-3 text-[10px] text-text outline-none"
              >
                <option value="" selected disabled>
                  Selecione
                </option>

                <option value="consumido">
                  Consumido
                </option>

                <option value="vencimento">
                  Vencimento
                </option>

                <option value="contaminado">
                  Contaminado
                </option>

                <option value="danificado">
                  Danificado
                </option>

                <option value="outro">
                  Outro
                </option>
              </select>

            </div>

            <!-- Observação -->
            <div class="mt-6">

              <label
                for="observacao"
                class="mb-2 block text-xs font-medium text-text"
              >
                Observação
                <span class="text-red-600">*</span>
              </label>

              <textarea
                id="observacao"
                name="observacao"
                placeholder="Digite aqui"
                required
                class="h-[84px] w-full resize-none rounded border border-gray-400 bg-primary-light px-3 py-2 text-[10px] text-text outline-none"
              ></textarea>

            </div>

            <!-- Botões -->
            <div
              class="mt-7 flex justify-end gap-3"
            >

              <button
                type="button"
                class="flex h-[28px] w-[92px] cursor-pointer items-center justify-center rounded bg-primary-dark text-[10px] font-semibold text-white"
              >
                Cancelar
              </button>

              <button
                type="submit"
                class="flex h-[28px] w-[108px] cursor-pointer items-center justify-center rounded bg-gray-200 text-[9px] font-medium text-text"
              >
                Registrar Saída
              </button>

            </div>

          </form>

        </section>

      </div>

    </main>

    <div id="footer-placeholder"></div>

  </div>

  <!-- Componentes compartilhados -->
  <script src="/public/js/load-partials.js"></script>

  <!-- Integração da Tela 7 com o backend -->
  <script src="/public/js/registrar-saida.js"></script>

</body>

</html>
