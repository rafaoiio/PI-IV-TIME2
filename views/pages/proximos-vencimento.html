<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Próximos do vencimento</title>

  <link rel="stylesheet" href="/public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

  <aside
    id="aside-placeholder"
    class="w-[180px] shrink-0"
  ></aside>

  <div class="flex min-w-0 flex-1 flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-1">

      <div class="w-full px-6 pt-8">

        <!-- Breadcrumb -->
        <div
          class="mb-8 flex min-h-[35px] items-center text-base"
        >
          <span class="text-text-secondary">
            Produtos
          </span>

          <span class="ml-1 font-semibold text-text">
            / Próximo do vencimento
          </span>
        </div>

        <!-- Card -->
        <section
          class="w-full overflow-hidden rounded-md bg-gray-200"
        >

          <!-- Título -->
          <div class="px-6 pt-4">
            <h1
              class="text-base font-semibold text-text"
            >
              Vencimento
            </h1>
          </div>

          <!-- Filtros -->
          <div
            class="mt-5 flex items-center gap-4 px-6"
          >

            <button
              type="button"
              data-filter
              class="flex h-[21px] w-[114px] cursor-pointer items-center justify-center rounded bg-primary-dark text-[10px] font-semibold text-white"
            >
              Hoje
            </button>

            <button
              type="button"
              data-filter
              class="flex h-[21px] w-[114px] cursor-pointer items-center justify-center rounded bg-gray-200 text-[10px] font-semibold text-text"
            >
              Próx. 3 dias
            </button>

            <button
              type="button"
              data-filter
              class="flex h-[21px] w-[114px] cursor-pointer items-center justify-center rounded bg-gray-200 text-[10px] font-semibold text-text"
            >
              Próx. 7 dias
            </button>

          </div>

          <!-- Cabeçalho -->
          <div
            class="mt-3 grid min-h-[28px] grid-cols-[1fr_1fr_1.2fr_180px] items-center border-b-2 border-gray-400 text-center text-[11px] font-medium text-text"
          >

            <span>
              Título
            </span>

            <span>
              Qtd.
            </span>

            <span>
              Validade
            </span>

            <span>
              Ações
            </span>

          </div>

          <!-- Produto -->
          <div
            class="grid min-h-[34px] grid-cols-[1fr_1fr_1.2fr_180px] items-center text-center text-text"
          >

            <span class="text-base font-bold">
              Leite
            </span>

            <span class="text-base font-bold">
              10 uni.
            </span>

            <span class="text-[20px] font-bold">
              10/09/2026
            </span>

            <div
              class="flex items-center justify-center gap-2 text-primary"
            >

              <!-- Configurações -->
              <button
                type="button"
                class="cursor-pointer"
                aria-label="Configurações"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V20.3h-3v-.09a1.7 1.7 0 0 0-1.03-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.55-1.03H5.3v-3h.15A1.7 1.7 0 0 0 7 9.94a1.7 1.7 0 0 0-.34-1.88L6.6 8l2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.69 4.7V4.6h3v.1a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.78 8l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.03h.15v3h-.15A1.7 1.7 0 0 0 19.4 15Z"></path>
                </svg>
              </button>

              <!-- Documento -->
              <button
                type="button"
                class="cursor-pointer"
                aria-label="Visualizar"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 3h8l4 4v14H6Z"></path>
                  <path d="M14 3v4h4"></path>
                  <path d="M9 11h6"></path>
                  <path d="M9 14h6"></path>
                  <path d="M9 17h4"></path>
                </svg>
              </button>

              <!-- Excluir -->
              <button
                type="button"
                class="cursor-pointer"
                aria-label="Excluir"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 7h16"></path>
                  <path d="M9 7V4h6v3"></path>
                  <path d="M7 7l1 13h8l1-13"></path>
                  <path d="M10 10v7"></path>
                  <path d="M14 10v7"></path>
                </svg>
              </button>

            </div>

          </div>

        </section>

      </div>

    </main>

    <div id="footer-placeholder"></div>

  </div>

  <script src="/public/js/load-partials.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filtros = document.querySelectorAll("[data-filter]");

      filtros.forEach((botao) => {
        botao.addEventListener("click", () => {
          filtros.forEach((item) => {
            item.classList.remove(
              "bg-primary-dark",
              "text-white"
            );

            item.classList.add(
              "bg-gray-200",
              "text-text"
            );
          });

          botao.classList.remove(
            "bg-gray-200",
            "text-text"
          );

          botao.classList.add(
            "bg-primary-dark",
            "text-white"
          );
        });
      });
    });
  </script>

</body>

</html>
