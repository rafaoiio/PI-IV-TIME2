
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Próximos do vencimento</title>

  <link rel="stylesheet" href="/public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

  <!-- Sidebar -->
  <aside
    id="aside-placeholder"
    class="w-[180px] shrink-0"
  ></aside>

  <div class="flex min-w-0 flex-1 flex-col">

    <!-- Cabeçalho -->
    <div id="header-placeholder"></div>

    <main class="flex-1">

      <div class="w-full px-6 pt-8">

        <!-- Breadcrumb -->
        <div
          class="mb-8 flex min-h-[35px] items-center text-base"
        >
          <span class="text-text-secondary">
            Lotes
          </span>

          <span class="ml-1 font-semibold text-text">
            / Próximos do vencimento
          </span>
        </div>

        <!-- Card principal -->
        <section
          class="w-full overflow-hidden rounded-md bg-gray-200"
        >

          <!-- Título -->
          <div class="px-6 pt-4">
            <h1
              class="text-base font-semibold text-text"
            >
              Vencimento
            </h1>
          </div>

          <!-- Filtros de vencimento -->
          <div
            class="mt-5 flex items-center gap-4 px-6"
          >

            <!-- Hoje -->
            <button
              type="button"
              data-dias="1"
              aria-pressed="false"
              class="flex h-[21px] w-[114px] cursor-pointer items-center justify-center rounded bg-gray-200 text-[10px] font-semibold text-text"
            >
              Hoje
            </button>

            <!-- Próximos 3 dias -->
            <button
              type="button"
              data-dias="3"
              aria-pressed="false"
              class="flex h-[21px] w-[114px] cursor-pointer items-center justify-center rounded bg-gray-200 text-[10px] font-semibold text-text"
            >
              Próx. 3 dias
            </button>

            <!-- Próximos 7 dias -->
            <button
              type="button"
              data-dias="7"
              aria-pressed="true"
              class="flex h-[21px] w-[114px] cursor-pointer items-center justify-center rounded bg-primary-dark text-[10px] font-semibold text-white"
            >
              Próx. 7 dias
            </button>

          </div>

          <!-- Cabeçalho da listagem -->
          <div
            class="mt-3 grid min-h-[28px] grid-cols-[1fr_1fr_1.2fr_180px] items-center border-b-2 border-gray-400 text-center text-[11px] font-medium text-text"
          >

            <span>
              Título
            </span>

            <span>
              Qtd.
            </span>

            <span>
              Validade
            </span>

            <span>
              Ações
            </span>

          </div>

          <!-- Mensagens de carregamento, erro e lista vazia -->
          <p
            id="mensagem-vencimentos"
            role="status"
            aria-live="polite"
            class="px-6 py-4 text-center text-sm text-text-secondary"
          >
            Carregando lotes...
          </p>

          <!-- Lista de lotes preenchida pelo JavaScript -->
          <div id="lista-vencimentos"></div>

        </section>

      </div>

    </main>

    <!-- Rodapé -->
    <div id="footer-placeholder"></div>

  </div>

  <!-- Componentes compartilhados -->
  <script src="/public/js/load-partials.js"></script>

  <!-- Integração da tela com o backend Java -->
  <script src="/public/js/proximos-vencimento.js"></script>

</body>

</html>
