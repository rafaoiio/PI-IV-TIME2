<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Histórico de Desperdício | PsicomManager</title>

  <link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen flex-col bg-background md:flex-row">

  <aside
    id="aside-placeholder"
    class="w-full shrink-0 md:w-[180px]"
  ></aside>

  <div class="flex min-w-0 flex-1 flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-1">
      <div class="w-full px-8 py-8">

        <!-- Breadcrumb -->
        <div class="mb-10 text-[14px] text-text-secondary">
          <span class="text-gray-500">
            Desperdício
          </span>

          <span class="mx-1">
            /
          </span>

          <span class="font-medium text-text">
            Histórico
          </span>
        </div>

        <!-- Card -->
        <section
          class="
            w-full
            overflow-hidden
            rounded-[8px]
            bg-[#F1F1F1]
            shadow-sm
            "
        >

          <!-- Título do card -->
          <div class="px-6 py-4">
            <h1
              class="
                text-[18px]
                font-medium
                text-text
              "
            >
              Histórico
            </h1>
          </div>

          <!-- Tabela -->
          <div class="overflow-x-auto">

            <table
              class="
                w-full
                min-w-[760px]
                border-collapse
                text-left
              "
            >

              <thead>
                <tr
                  class="
                    border-b
                    border-[#5F6874]
                    text-[12px]
                    font-normal
                    text-text
                  "
                >
                  <th class="px-6 py-2 font-normal">
                    Produto
                  </th>

                  <th class="px-6 py-2 text-center font-normal">
                    Qtd. Desperdiçada
                  </th>

                  <th class="px-6 py-2 text-center font-normal">
                    Motivo
                  </th>

                  <th class="px-6 py-2 text-center font-normal">
                    Data
                  </th>

                  <th class="px-6 py-2 text-center font-normal">
                    Registrado por
                  </th>
                </tr>
              </thead>

              <tbody id="historico-desperdicio">

                <!-- Exemplo de registro -->
                <tr
                  class="
                    bg-[#E4E5E5]
                    text-[14px]
                    font-semibold
                    text-text
                  "
                >
                  <td class="px-6 py-2">
                    Leite
                  </td>

                  <td class="px-6 py-2 text-center">
                    10 uni.
                  </td>

                  <td class="px-6 py-2 text-center">
                    Vencimento
                  </td>

                  <td class="px-6 py-2 text-center">
                    10/09/2026
                  </td>

                  <td class="px-6 py-2 text-center">
                    Fulano
                  </td>
                </tr>

              </tbody>

            </table>

          </div>

        </section>

      </div>
    </main>

    <div id="footer-placeholder"></div>

  </div>

  <script src="../../public/js/load-partials.js"></script>

</body>
</html>
