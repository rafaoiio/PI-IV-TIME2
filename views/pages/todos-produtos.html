
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todos os produtos | Sistema de Gestão e Redução de Desperdício</title>

    <link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

    <!-- MENU LATERAL -->
    <aside id="aside-placeholder" class="w-[180px] shrink-0"></aside>

    <div class="flex min-w-0 flex-1 flex-col">

        <!-- CABEÇALHO -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <div class="w-full px-6 pt-8">

                <!-- CAMINHO DA PÁGINA -->
                <div class="mb-8 flex min-h-[35px] items-center text-base">

                    <span class="text-text-secondary">
                        Produtos
                    </span>

                    <span class="ml-1 font-semibold text-text">
                        / Todos os produtos
                    </span>

                </div>

                <!-- CARD PRINCIPAL -->
                <section class="w-full rounded-md bg-white px-6 py-5">

                    <!-- TITULO E BOTAO ADICIONAR -->
                    <div class="mb-10 flex items-center justify-between">

                        <h1 class="text-base font-semibold text-text">
                            Todos os produtos
                        </h1>

                        <a href="cadastro-produtos.html"
                            title="Cadastrar novo produto"
                            aria-label="Cadastrar novo produto"
                            class="flex h-[28px] w-[28px] items-center justify-center rounded-full bg-primary-dark text-white">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2.5">

                                <path stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 5v14m-7-7h14" />

                            </svg>

                        </a>

                    </div>

                    <!-- TABELA DE PRODUTOS -->
                    <div class="w-full overflow-x-auto">

                        <table class="w-full min-w-[1000px] border-collapse text-left text-xs text-text">

                            <!-- CABEÇALHO DA TABELA -->
                            <thead>

                                <tr class="border-b border-gray-400 text-text-secondary">

                                    <!-- TÍTULO -->
                                    <th class="px-3 py-3 font-medium">
                                        Título
                                    </th>

                                    <!-- CATEGORIA -->
                                    <th class="px-3 py-3 font-medium">
                                        Categoria
                                    </th>

                                    <!-- UNIDADE DE MEDIDA -->
                                    <th class="px-3 py-3 font-medium">
                                        Unidade de Medida
                                    </th>

                                    <!-- QUANTIDADE TOTAL -->
                                    <th class="px-3 py-3 font-medium">
                                        Quantidade Total
                                    </th>

                                    <!-- PREÇO UNITÁRIO -->
                                    <th class="px-3 py-3 font-medium">
                                        Preço Unitário
                                    </th>

                                    <!-- VALIDADE -->
                                    <th class="px-3 py-3 font-medium">
                                        Validade
                                    </th>

                                    <!-- STATUS -->
                                    <th class="px-3 py-3 font-medium">
                                        Status
                                    </th>

                                    <!-- AÇÕES -->
                                    <th class="px-3 py-3 text-center font-medium">
                                        Ações
                                    </th>

                                </tr>

                            </thead>

                            <!-- PRODUTOS CARREGADOS DO MONGODB -->
                            <tbody id="tabelaProdutos">

                                <tr>

                                    <td colspan="8"
                                        class="px-3 py-6 text-center text-text-secondary">

                                        Carregando produtos...

                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                    <!-- MENSAGEM DE ERRO -->
                    <p id="mensagemErro"
                        class="mt-4 hidden text-xs text-red-600"
                        role="alert">
                    </p>

                </section>

            </div>

        </main>

        <!-- RODAPÉ -->
        <div id="footer-placeholder"></div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="../../public/js/load-partials.js"></script>
    <script src="../../public/js/todos-produtos.js"></script>

</body>

</html>
