<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- ALTERE O NOME EM CADA PÁGINA -->
	<title>Cadastrar Produto | Sistema de Gestão e Redução de Desperdício</title>

	<link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

	<aside id="aside-placeholder" class="w-[180px] shrink-0"></aside>

	<div class="flex min-w-0 flex-1 flex-col">

		<div id="header-placeholder"></div>

		<main class="flex-1">
			<div class="mx-auto w-full max-w-6xl px-6 py-8">

				<h1 class="mb-6 text-2xl font-bold text-text-secondary md:text-3xl">
					Produtos / Cadastrar Produto
				</h1>

				<!-- CONTEÚDO DA PÁGINA -->
				<section class="rounded-md bg-white p-6">

					<h2 class="mb-6 text-base font-semibold text-text">
						Cadastrar novo produto
					</h2>

					<form class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-4">

						<!-- NOME DO PRODUTO -->
						<div class="flex flex-col gap-2">
							<label for="nomeProduto" class="text-xs font-semibold text-text">
								Nome do produto
								<span class="text-red-500">*</span>
							</label>

							<input type="text" id="nomeProduto" name="nomeProduto" placeholder="Digite aqui" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
						</div>

						<!-- QUANTIDADE -->
						<div class="flex flex-col gap-2">
							<label for="quantidade" class="text-xs font-semibold text-text">
								Qtd. disponível
								<span class="text-red-500">*</span>
							</label>

							<input type="number" id="quantidade" name="quantidade" placeholder="ex. 5" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
						</div>

						<!-- UNIDADE DE MEDIDA -->
						<div class="flex flex-col gap-2">
							<label for="unidadeMedida" class="text-xs font-semibold text-text">
								Unidade de medida
								<span class="text-red-500">*</span>
							</label>

							<select id="unidadeMedida" name="unidadeMedida" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
								<option value="">Selecione</option>
								<option value="kg">Quilograma (kg)</option>
								<option value="g">Grama (g)</option>
								<option value="l">Litro (L)</option>
								<option value="ml">Mililitro (ml)</option>
								<option value="un">Unidade (un)</option>
							</select>
						</div>

						<!-- DATA DE VALIDADE -->
						<div class="flex flex-col gap-2">
							<label for="dataValidade" class="text-xs font-semibold text-text">
								Data de Validade
								<span class="text-red-500">*</span>
							</label>

							<input type="date" id="dataValidade" name="dataValidade" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
						</div>

						<!-- CATEGORIA DO PRODUTO -->
						<div class="flex flex-col gap-2">
							<label for="categoria" class="text-xs font-semibold text-text">
								Categoria do produto
								<span class="text-red-500">*</span>
							</label>

							<select id="categoria" name="categoria" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
								<option value="">Selecione</option>
								<option value="laticinios">Laticínios</option>
								<option value="verduras-legumes">Verduras e Legumes</option>
								<option value="bebidas">Bebidas não alcoólicas</option>
								<option value="outro">Outro</option>
							</select>
						</div>

						<!-- LOTE -->
						<div class="flex flex-col gap-2">
							<label for="lote" class="text-xs font-semibold text-text">
								Lote
								<span class="text-red-500">*</span>
							</label>

							<input type="text" id="lote" name="lote" placeholder="Digite aqui" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
						</div>

						<!-- REGISTRO DO PRODUTO NO ESTOQUE -->
						<div class="flex flex-col gap-2">
							<label for="registroEstoque" class="text-xs font-semibold text-text">
								Registro do produto no estoque
								<span class="text-red-500">*</span>
							</label>

							<input type="text" id="registroEstoque" name="registroEstoque" placeholder="Digite aqui" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
						</div>

						<!-- STATUS -->
						<div class="flex flex-col gap-2">
							<label for="status" class="text-xs font-semibold text-text">
								Status
								<span class="text-red-500">*</span>
							</label>

							<select id="status" name="status" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
								<option value="">Selecione uma opção</option>
								<option value="disponivel">Disponível</option>
								<option value="indisponivel">Indisponível</option>
							</select>
						</div>

						<!-- VALOR UNITÁRIO -->
						<div class="flex flex-col gap-2">
							<label for="valorUnitario" class="text-xs font-semibold text-text">
								Valor unitário
								<span class="text-red-500">*</span>
							</label>

							<input type="number" id="valorUnitario" name="valorUnitario" placeholder="R$20" step="0.01" min="0"
								required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none">
						</div>

						<!-- OBSERVAÇÃO -->
						<div class="flex flex-col gap-2 md:col-span-2 lg:col-span-4">
							<label for="observacao" class="text-xs font-semibold text-text">
								Observação
								<span class="text-red-500">*</span>
							</label>

							<textarea id="observacao" name="observacao" placeholder="Digite aqui" rows="5" required
								class="w-full rounded-md border border-gray-400 bg-[#e9ebee] px-3 py-2 text-xs text-text outline-none"></textarea>
						</div>

						<!-- BOTÕES -->
						<div class="flex justify-end gap-3 md:col-span-2 lg:col-span-4">

							<button type="button"
								class="cursor-pointer rounded-md bg-primary-dark px-6 py-2 text-xs font-semibold text-white">
								Cancelar
							</button>

							<button type="submit"
								class="cursor-pointer rounded-md bg-gray-200 px-6 py-2 text-xs font-semibold text-text">
								Cadastrar novo produto
							</button>

						</div>


					</form>

				</section>


			</div>
		</main>

		<div id="footer-placeholder"></div>
	</div>

	<script src="../../public/js/load-partials.js"></script>
</body>

</html>
