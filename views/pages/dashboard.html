<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ALTERE O NOME EM CADA PÁGINA -->
  <title>Dashboard | Gestão de Desperdício</title>

  <link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen flex-col bg-background md:flex-row">

  <aside id="aside-placeholder" class="w-full shrink-0 md:w-[180px]"></aside>

  <div class="flex min-w-0 flex-1 flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-1">
      <div class="w-full px-3 py-4 sm:px-6 sm:py-8">

        <div class="rounded-lg bg-white p-4 sm:mt-3 sm:min-h-[150px]">
          <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 sm:gap-x-5">
            <h1 class="text-xl text-text sm:text-2xl">Olá, </h1>
            <p class="min-w-0 max-w-full break-words text-3xl font-bold text-text-secondary sm:text-4xl lg:text-5xl">*Nome User*</p>
          </div>

            <div class="mt-4 flex flex-wrap items-center gap-2 text-xs">
              <button class="rounded-sm px-2 py-1 bg-primary text-white hover:bg-primary-dark cursor-pointer">
                Produtos
              </button>

              <button class="rounded-sm px-2 py-1 bg-primary text-white hover:bg-primary-dark cursor-pointer">
                Próx. Vencimento
              </button>
          </div>
        </div>

        
          <div class=" flex items-center gap-8 mt-5 h-full justify-center">
            <div class="bg-white rounded-xl shadow-md p-6 w-60 text-center transition-all duration-300 ease-in-out hover:-translate-y-1 hover:shadow-xl text-text font-semibold">
              120 produtos
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 w-60 text-center transition-all duration-300 ease-in-out hover:-translate-y-1  hover:shadow-xl text-text font-semibold">
              40 próx. Vencimento
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 w-60 text-center transition-all duration-300 ease-in-out hover:-translate-y-1 hover:shadow-xl text-text font-semibold">
              30 Desperdício
            </div>
          </div>

          <section class="mt-6 w-full rounded-xl bg-white px-5 py-4 text-text shadow-md sm:px-10">
            <h2 id="titulo-vencimentos" clas="text-xs font-medium">
                Produtos próximos do Vencimento
            </h2>

            <div class="mx-auto mt-4 max-w-4xl">  
              <table aria-labelledby="titulo-vencimentos" class="w-full table-fixed text-center text-sm font-semibold leading-tight">

                <thead class="sr-only">
                  <tr>
                    <th scope="col">
                      Produto
                    </th>
                    <th scope="col">
                      Produto
                    </th>
                    <th scope="col">
                      Produto
                    </th>
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>
                      Leite
                    </td>
                    <td>
                      10 un.
                    </td>
                    <td class="text-danger">
                      Vence hoje
                    </td>
                  </tr>

                  <tr>
                    <td>Tomate</td>
                    <td>15kg</td>
                    <td class="text-danger">Vence amanhã</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="mt-6 w-full rounded-xl bg-white px-5 py-4 text-text shadow-md sm:px-10">
            <h2 class="text-xs font-medium">
              Desperdício nos últimos meses
            </h2>
            <!-- Gráfico -->
                <div id="area-chart"></div>
          </section>

      </div>
    </main>

    <div id="footer-placeholder"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.46.0/dist/apexcharts.min.js"></script>
  <script src="/public/js/dashboard-inicio.js"></script>
  <script src="../../public/js/load-partials.js"></script>
</body>
</html>
