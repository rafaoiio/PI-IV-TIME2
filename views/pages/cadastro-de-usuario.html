<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cadastro | PsicomManager</title>

  <link
    rel="stylesheet"
    href="../../public/css/style.css"
  >
</head>

<body class="min-h-screen bg-[#202020] p-2 font-sans">

  <main
    class="
      grid
      min-h-[calc(100vh-16px)]
      grid-cols-1
      overflow-hidden
      bg-background
      lg:grid-cols-[36%_64%]
    "
  >

    <!-- Lado esquerdo: cadastro -->
    <section
      class="
        flex
        min-h-[calc(100vh-16px)]
        items-center
        justify-center
        bg-[#DDE2E4]
        px-[12%]
        py-12
        lg:min-h-0
        lg:rounded-r-[24px]
      "
    >

      <form
        id="formCadastro"
        class="w-full max-w-[380px]"
        novalidate
      >

        <!-- Primeira etapa -->
        <div id="etapaDados">

          <div class="mb-8">
            <h1 class="text-[26px] font-semibold text-text">
              Cadastre-se
            </h1>
          </div>

          <!-- Nome completo -->
          <div class="mb-5">

            <label
              for="nome"
              class="mb-1.5 block text-label text-text"
            >
              Nome completo
              <span class="text-danger">*</span>
            </label>

            <input
              id="nome"
              name="nome"
              type="text"
              required
              minlength="3"
              maxlength="100"
              autocomplete="name"
              placeholder="Digite aqui"
              aria-describedby="erroNome"

              class="
                h-[32px] w-full rounded-[4px]
                border border-border bg-[#E2E7E8]
                px-3 text-[13px] text-text
                outline-none placeholder:text-text-secondary
                transition focus:border-primary
                aria-invalid:border-danger
              "
            >

            <p
              id="erroNome"
              class="mt-1 hidden text-[11px] text-danger"
            ></p>

          </div>

          <!-- E-mail -->
          <div class="mb-5">

            <label
              for="email"
              class="mb-1.5 block text-label text-text"
            >
              E-mail
              <span class="text-danger">*</span>
            </label>

            <input
              id="email"
              name="email"
              type="email"
              required
              maxlength="150"
              autocomplete="email"
              placeholder="Digite aqui"
              aria-describedby="erroEmail"

              class="
                h-[32px] w-full rounded-[4px]
                border border-border bg-[#E2E7E8]
                px-3 text-[13px] text-text
                outline-none placeholder:text-text-secondary
                transition focus:border-primary
                aria-invalid:border-danger
              "
            >

            <p
              id="erroEmail"
              class="mt-1 hidden text-[11px] text-danger"
            ></p>

          </div>

          <!-- Celular / WhatsApp -->
          <div class="mb-5">

            <label
              for="celular"
              class="mb-1.5 block text-label text-text"
            >
              Celular / WhatsApp
              <span class="text-danger">*</span>
            </label>

            <input
              id="celular"
              name="celular"
              type="tel"
              required
              maxlength="19"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="+55 (19) 99999-9999"
              aria-describedby="erroCelular"

              class="
                h-[32px] w-full rounded-[4px]
                border border-border bg-[#E2E7E8]
                px-3 text-[13px] text-text
                outline-none placeholder:text-text-secondary
                transition focus:border-primary
                aria-invalid:border-danger
              "
            >

            <p
              id="erroCelular"
              class="mt-1 hidden text-[11px] text-danger"
            ></p>

          </div>

          <!-- Botão Próximo -->
          <button
            id="btnProximo"
            type="button"

            class="
              flex h-[36px] w-full
              items-center justify-center
              rounded-[7px] bg-[#174F54]
              text-[18px] font-normal text-white
              transition hover:bg-[#123F43]
              active:scale-[0.99]
            "
          >
            Próximo
          </button>

          <!-- Termos -->
          <p
            class="
              mx-auto mt-2 max-w-[310px]
              text-center text-[9px]
              leading-[13px] text-text
            "
          >
            Ao informar meus dados, eu concordo com a

            <a
              href="#"
              class="underline hover:text-primary"
            >
              Política de Privacidade
            </a>

            e

            <a
              href="#"
              class="underline hover:text-primary"
            >
              Termos de Uso
            </a>

            do PsicomManager
          </p>

        </div>


        <!-- Segunda etapa -->
        <div id="etapaSenha" class="hidden">

          <div class="mb-8">
            <h1 class="text-[26px] font-semibold text-text">
              Crie sua senha
            </h1>
          </div>

          <!-- Senha -->
          <div class="mb-5">

            <label
              for="senha"
              class="mb-1.5 block text-label text-text"
            >
              Senha
              <span class="text-danger">*</span>
            </label>

            <div class="relative">

              <input
                id="senha"
                name="senha"
                type="password"
                required
                minlength="8"
                maxlength="50"
                autocomplete="new-password"
                placeholder="Digite sua senha"
                aria-describedby="erroSenha"

                class="
                  h-[32px] w-full rounded-[4px]
                  border border-border bg-[#E2E7E8]
                  px-3 pr-10 text-[13px] text-text
                  outline-none placeholder:text-text-secondary
                  transition focus:border-primary
                  aria-invalid:border-danger
                "
              >

              <button
                id="btnMostrarSenha"
                type="button"
                aria-label="Mostrar senha"
                aria-pressed="false"

                class="
                  absolute right-3 top-1/2
                  -translate-y-1/2 cursor-pointer
                  text-primary-darker
                "
              >
                <svg
                  viewBox="0 0 24 24"
                  class="size-[18px]"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                  />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>

            </div>

            <p
              id="erroSenha"
              class="mt-1 hidden text-[11px] text-danger"
            ></p>

          </div>

          <!-- Confirmar senha -->
          <div class="mb-5">

            <label
              for="confirmarSenha"
              class="mb-1.5 block text-label text-text"
            >
              Confirmar senha
              <span class="text-danger">*</span>
            </label>

            <div class="relative">

              <input
                id="confirmarSenha"
                name="confirmarSenha"
                type="password"
                required
                minlength="8"
                maxlength="50"
                autocomplete="new-password"
                placeholder="Digite novamente"
                aria-describedby="erroConfirmarSenha"

                class="
                  h-[32px] w-full rounded-[4px]
                  border border-border bg-[#E2E7E8]
                  px-3 pr-10 text-[13px] text-text
                  outline-none placeholder:text-text-secondary
                  transition focus:border-primary
                  aria-invalid:border-danger
                "
              >

              <button
                id="btnMostrarConfirmacao"
                type="button"
                aria-label="Mostrar senha"
                aria-pressed="false"

                class="
                  absolute right-3 top-1/2
                  -translate-y-1/2 cursor-pointer
                  text-primary-darker
                "
              >
                <svg
                  viewBox="0 0 24 24"
                  class="size-[18px]"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                  />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>

            </div>

            <p
              id="erroConfirmarSenha"
              class="mt-1 hidden text-[11px] text-danger"
            ></p>

          </div>

          <!-- Botões -->
          <div class="flex gap-3">

            <button
              id="btnVoltar"
              type="button"

              class="
                h-[36px] flex-1 rounded-[7px]
                border border-primary
                text-[15px] text-primary
                transition hover:bg-primary-light
                active:scale-[0.99]
              "
            >
              Voltar
            </button>

            <button
              id="btnCadastrar"
              type="submit"

              class="
                h-[36px] flex-1 rounded-[7px]
                bg-[#174F54] text-[16px] text-white
                transition hover:bg-[#123F43]
                active:scale-[0.99]
                disabled:cursor-wait disabled:opacity-70
              "
            >
              Cadastrar
            </button>

          </div>

          <!-- Mensagens gerais de erro da API -->
          <p
            id="mensagemCadastro"
            role="alert"
            class="
              mt-3 hidden text-center
              text-[12px] text-danger
            "
          ></p>

        </div>

      </form>
    </section>


    <!-- Lado direito: imagem -->
    <section
      class="
        relative hidden min-h-0
        overflow-hidden lg:block
      "
    >

      <img
        src="../../public/images/cadastro-bg.jpeg"
        alt="Profissional utilizando um tablet em um estabelecimento"

        class="
          absolute inset-0 h-full w-full
          object-cover object-[32%_center]
        "
      >

      <div
        class="
          pointer-events-none absolute
          inset-0 bg-black/10
        "
      ></div>

    </section>

  </main>


  <!-- Modal de sucesso -->
  <!-- Fora do main para ocupar a tela inteira -->

  <div
    id="modalSucesso"

    class="
      fixed inset-0 z-[9999]
      hidden items-center justify-center
      bg-black/50 p-5
      backdrop-blur-[4px]
    "

    role="dialog"
    aria-modal="true"
    aria-labelledby="tituloModalSucesso"
    aria-describedby="descricaoModalSucesso"
    tabindex="-1"
  >

    <!-- Caixa central -->
    <div
      id="caixaModalSucesso"

      class="
        flex w-full max-w-[360px]
        translate-y-3 scale-95
        flex-col items-center gap-[14px]
        rounded-2xl bg-[#DDE2E4]
        px-7 py-8 text-center
        opacity-0 shadow-2xl
        transition-all duration-300 ease-out
      "
    >

      <!-- Ícone de sucesso -->
      <div
        class="
          flex size-12 items-center justify-center
          rounded-full bg-[#174F54]
          text-[26px] font-bold text-white
        "
        aria-hidden="true"
      >
        ✓
      </div>

      <!-- Título -->
      <h2
        id="tituloModalSucesso"
        class="text-[20px] font-semibold text-[#174F54]"
      >
        Cadastro realizado!
      </h2>


      <!-- Spinner -->
      <div
        class="
          mt-1 size-7 animate-spin
          rounded-full border-[3px]
          border-[#B8CECB]
          border-t-[#174F54]
        "
        aria-hidden="true"
      ></div>

      <!-- Redirecionamento -->
      <p class="text-[12px] text-[#174F54]">
        Redirecionando para o login...
      </p>

    </div>

  </div>


  <script src="../../public/js/cadastro-de-usuario.js"></script>

</body>
</html>
