<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cadastro | PsicomManager</title>

  <link
    rel="stylesheet"
    href="../../public/css/style.css"
  >
</head>


<body class="min-h-screen bg-[#202020] p-2 font-sans">

  <main
    class="
      grid
      min-h-[calc(100vh-16px)]
      grid-cols-1
      overflow-hidden
      bg-background

      lg:grid-cols-[36%_64%]
    "
  >


    <!-- ========================================= -->
    <!-- LADO ESQUERDO - FORMULÁRIO               -->
    <!-- ========================================= -->

    <section
      class="
        flex
        min-h-[calc(100vh-16px)]
        items-center
        justify-center
        bg-[#DDE2E4]
        px-[12%]
        py-12

        lg:min-h-0
        lg:rounded-r-[24px]
      "
    >

      <form
        id="formCadastro"
        class="w-full max-w-[380px]"
        novalidate
      >


        <!-- ===================================== -->
        <!-- ETAPA 1 - DADOS PESSOAIS             -->
        <!-- ===================================== -->

        <div id="etapaDados">

          <div class="mb-8">
            <h1 class="text-[26px] font-semibold text-text">
              Cadastre-se
            </h1>
          </div>


          <!-- Nome completo -->
          <div class="mb-5">

            <label
              for="nome"
              class="mb-1.5 block text-label text-text"
            >
              Nome completo
              <span class="text-danger">*</span>
            </label>


            <input
              id="nome"
              name="nome"
              type="text"
              required
              minlength="3"
              maxlength="100"
              autocomplete="name"
              placeholder="Digite aqui"
              aria-describedby="erroNome"

              class="
                h-[32px]
                w-full
                rounded-[4px]
                border
                border-border
                bg-[#E2E7E8]
                px-3
                text-[13px]
                text-text
                outline-none
                placeholder:text-text-secondary
                transition
                focus:border-primary
                aria-invalid:border-danger
              "
            >


            <p
              id="erroNome"
              class="
                mt-1
                hidden
                text-[11px]
                text-danger
              "
            ></p>

          </div>



          <!-- E-mail -->
          <div class="mb-5">

            <label
              for="email"
              class="mb-1.5 block text-label text-text"
            >
              E-mail
              <span class="text-danger">*</span>
            </label>


            <input
              id="email"
              name="email"
              type="email"
              required
              maxlength="150"
              autocomplete="email"
              placeholder="Digite aqui"
              aria-describedby="erroEmail"

              class="
                h-[32px]
                w-full
                rounded-[4px]
                border
                border-border
                bg-[#E2E7E8]
                px-3
                text-[13px]
                text-text
                outline-none
                placeholder:text-text-secondary
                transition
                focus:border-primary
                aria-invalid:border-danger
              "
            >


            <p
              id="erroEmail"
              class="
                mt-1
                hidden
                text-[11px]
                text-danger
              "
            ></p>

          </div>



          <!-- Celular / WhatsApp -->
          <div class="mb-5">

            <label
              for="celular"
              class="mb-1.5 block text-label text-text"
            >
              Celular / WhatsApp
              <span class="text-danger">*</span>
            </label>


            <input
              id="celular"
              name="celular"
              type="tel"
              required
              maxlength="19"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="+55 (19) 99999-9999"
              aria-describedby="erroCelular"

              class="
                h-[32px]
                w-full
                rounded-[4px]
                border
                border-border
                bg-[#E2E7E8]
                px-3
                text-[13px]
                text-text
                outline-none
                placeholder:text-text-secondary
                transition
                focus:border-primary
                aria-invalid:border-danger
              "
            >


            <p
              id="erroCelular"
              class="
                mt-1
                hidden
                text-[11px]
                text-danger
              "
            ></p>

          </div>



          <!-- Botão Próximo -->
          <button
            id="btnProximo"
            type="button"

            class="
              flex
              h-[36px]
              w-full
              items-center
              justify-center
              rounded-[7px]
              bg-[#174F54]
              text-[18px]
              font-normal
              text-white
              transition
              hover:bg-[#123F43]
              active:scale-[0.99]
            "
          >
            Próximo
          </button>



          <!-- Termos -->
          <p
            class="
              mx-auto
              mt-2
              max-w-[310px]
              text-center
              text-[9px]
              leading-[13px]
              text-text
            "
          >
            Ao informar meus dados, eu concordo com a

            <a
              href="#"
              class="underline hover:text-primary"
            >
              Política de Privacidade
            </a>

            e

            <a
              href="#"
              class="underline hover:text-primary"
            >
              Termos de Uso
            </a>

            do PsicomManager
          </p>

        </div>



        <!-- ===================================== -->
        <!-- ETAPA 2 - SENHA                      -->
        <!-- ===================================== -->

        <div
          id="etapaSenha"
          class="hidden"
        >

          <div class="mb-8">
            <h1 class="text-[26px] font-semibold text-text">
              Crie sua senha
            </h1>
          </div>   


          <!-- Senha -->
          <div class="mb-5">

            <label
              for="senha"
              class="mb-1.5 block text-label text-text"
            >
              Senha
              <span class="text-danger">*</span>
            </label>


            <div class="relative">

              <input
                id="senha"
                name="senha"
                type="password"
                required
                minlength="8"
                maxlength="50"
                autocomplete="new-password"
                placeholder="Digite sua senha"
                aria-describedby="erroSenha"

                class="
                  h-[32px]
                  w-full
                  rounded-[4px]
                  border
                  border-border
                  bg-[#E2E7E8]
                  px-3
                  pr-10
                  text-[13px]
                  text-text
                  outline-none
                  placeholder:text-text-secondary
                  transition
                  focus:border-primary
                  aria-invalid:border-danger
                "
              >


              <!-- Mostrar / esconder senha -->
              <button
                id="btnMostrarSenha"
                type="button"
                aria-label="Mostrar senha"

                class="
                  absolute
                  right-3
                  top-1/2
                  -translate-y-1/2
                  cursor-pointer
                  text-primary-darker
                "
              >

                <svg
                  viewBox="0 0 24 24"
                  class="size-[18px]"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="2.8"
                  />
                </svg>

              </button>

            </div>


            <p
              id="erroSenha"
              class="
                mt-1
                hidden
                text-[11px]
                text-danger
              "
            ></p>


            <p
              class="
                mt-1
                text-[10px]
                text-text-secondary
              "
            >
              A senha deve possuir pelo menos 8 caracteres.
            </p>

          </div>



          <!-- Confirmar senha -->
          <div class="mb-5">

            <label
              for="confirmarSenha"
              class="mb-1.5 block text-label text-text"
            >
              Confirmar senha
              <span class="text-danger">*</span>
            </label>


            <div class="relative">

              <input
                id="confirmarSenha"
                name="confirmarSenha"
                type="password"
                required
                minlength="8"
                maxlength="50"
                autocomplete="new-password"
                placeholder="Digite novamente"
                aria-describedby="erroConfirmarSenha"

                class="
                  h-[32px]
                  w-full
                  rounded-[4px]
                  border
                  border-border
                  bg-[#E2E7E8]
                  px-3
                  pr-10
                  text-[13px]
                  text-text
                  outline-none
                  placeholder:text-text-secondary
                  transition
                  focus:border-primary
                  aria-invalid:border-danger
                "
              >


              <!-- Mostrar / esconder confirmação -->
              <button
                id="btnMostrarConfirmacao"
                type="button"
                aria-label="Mostrar senha"

                class="
                  absolute
                  right-3
                  top-1/2
                  -translate-y-1/2
                  cursor-pointer
                  text-primary-darker
                "
              >

                <svg
                  viewBox="0 0 24 24"
                  class="size-[18px]"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="2.8"
                  />
                </svg>

              </button>

            </div>


            <p
              id="erroConfirmarSenha"
              class="
                mt-1
                hidden
                text-[11px]
                text-danger
              "
            ></p>

          </div>



          <!-- Botões -->
          <div class="flex gap-3">

            <button
              id="btnVoltar"
              type="button"

              class="
                h-[36px]
                flex-1
                rounded-[7px]
                border
                border-primary
                text-[15px]
                text-primary
                transition
                hover:bg-primary-light
                active:scale-[0.99]
              "
            >
              Voltar
            </button>


            <button
              type="submit"

              class="
                h-[36px]
                flex-[1]
                rounded-[7px]
                bg-[#174F54]
                text-[16px]
                text-white
                transition
                hover:bg-[#123F43]
                active:scale-[0.99]
              "
            >
              Cadastrar
            </button>

          </div>

        </div>

      </form>

    </section>



    <!-- ========================================= -->
    <!-- LADO DIREITO - IMAGEM                    -->
    <!-- ========================================= -->

    <section
      class="
        relative
        hidden
        min-h-0
        overflow-hidden
        lg:block
      "
    >

      <img
        src="../../public/images/cadastro-bg.jpeg"
        alt="Profissional utilizando um tablet em um estabelecimento"

        class="
          absolute
          inset-0
          h-full
          w-full
          object-cover
          object-[32%_center]
        "
      >


      <div
        class="
          pointer-events-none
          absolute
          inset-0
          bg-black/10
        "
      ></div>

    </section>

  </main>


  <script src="../../public/js/cadastro-de-usuario.js"></script>

</body>

</html>
