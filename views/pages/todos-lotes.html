<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todos os Lotes | Sistema de Gestão e Redução de Desperdício</title>

    <link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

    <!-- MENU LATERAL -->
    <aside id="aside-placeholder" class="w-[180px] shrink-0"></aside>

    <div class="flex min-w-0 flex-1 flex-col">

        <!-- CABEÇALHO -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <div class="w-full px-6 pt-8">

                <!-- CAMINHO -->
                <div class="mb-8 flex min-h-[35px] items-center text-base">
                    <span class="text-text-secondary">Lotes</span>
                    <span class="ml-1 font-semibold text-text">
                        / Todos os lotes
                    </span>
                </div>

                <!-- CARD -->
                <section class="w-full rounded-md bg-white px-6 py-5">

                    <div class="mb-10 flex items-center justify-between">

                        <h1 class="text-base font-semibold text-text">
                            Todos os lotes
                        </h1>

                        <!-- ADICIONAR LOTE -->
                        <a
                            href="cadastro-lotes.html"
                            title="Cadastrar novo lote"
                            aria-label="Cadastrar novo lote"
                            class="flex h-[28px] w-[28px] items-center justify-center rounded-full bg-primary-dark text-white">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2.5">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 5v14m-7-7h14"/>
                            </svg>
                        </a>
                    </div>

                    <!-- TABELA -->
                    <div class="w-full overflow-x-auto">

                        <table class="w-full min-w-[1100px] border-collapse text-left text-xs text-text">

                            <thead>
                                <tr class="border-b border-gray-400 text-text-secondary">

                                    <th class="px-3 py-2 font-medium">
                                        Código
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Produto
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Qtd. inicial
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Qtd. disponível
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Custo de aquisição
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Entrada
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Validade
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Status
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Ações
                                    </th>

                                </tr>
                            </thead>

                            <!-- LOTES DO MONGODB -->
                            <tbody id="tabelaLotes">
                                <tr>
                                    <td colspan="9"
                                        class="px-3 py-6 text-center text-text-secondary">
                                        Carregando lotes...
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                    <!-- ERROS -->
                    <p id="mensagemErro"
                        class="mt-4 hidden text-xs text-red-600"
                        role="alert"></p>

                    <!-- LEGENDA -->
                    <div class="mt-5 flex justify-end">

                        <div class="flex flex-wrap gap-4 text-[10px] text-text-secondary">
                            <span>Ativo</span>
                            <span>Próx. do vencimento</span>
                            <span>Vencido</span>
                            <span>Esgotado</span>
                            <span>Inativo</span>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO -->
    <div id="modalLote"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitulo">

        <div class="w-full max-w-[520px] rounded-lg bg-white p-6 shadow-lg">

            <h2 id="modalTitulo"
                class="mb-4 text-base font-semibold text-text">
            </h2>

            <p id="modalTexto"
                class="mb-6 text-sm text-text">
            </p>

            <div class="flex justify-end gap-3">

                <button id="modalCancelar"
                    type="button"
                    class="cursor-pointer rounded border border-gray-400 px-4 py-2 text-xs text-text">
                    Cancelar
                </button>

                <button id="modalConfirmar"
                    type="button"
                    class="cursor-pointer rounded bg-primary-dark px-4 py-2 text-xs font-semibold text-white disabled:opacity-50">
                    Confirmar
                </button>

            </div>
        </div>
    </div>

    <script src="../../public/js/load-partials.js"></script>
    <script src="../../public/js/todos-lotes.js"></script>

</body>
</html>
