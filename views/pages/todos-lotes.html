
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todos os Lotes | Sistema de Gestão e Redução de Desperdício</title>

    <link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

    <!-- Menu lateral -->
    <aside id="aside-placeholder" class="w-[180px] shrink-0"></aside>

    <div class="flex min-w-0 flex-1 flex-col">

        <!-- Cabeçalho -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <div class="w-full px-6 pt-8">

                <!-- Caminho da página -->
                <div class="mb-8 flex min-h-[35px] items-center text-base">

                    <span class="text-text-secondary">
                        Lotes
                    </span>

                    <span class="ml-1 font-semibold text-text">
                        / Todos os lotes
                    </span>

                </div>

                <!-- Card principal -->
                <section class="w-full rounded-md bg-white px-6 py-5">

                    <!-- Título e botão adicionar lote -->
                    <div class="mb-10 flex items-center justify-between">

                        <h1 class="text-base font-semibold text-text">
                            Todos os lotes
                        </h1>

                        <!-- Botão para cadastrar novo lote -->
                        <a
                            href="cadastro-lotes.html"
                            title="Cadastrar novo lote"
                            aria-label="Cadastrar novo lote"
                            class="flex h-[28px] w-[28px] items-center justify-center rounded-full bg-primary-dark text-white"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2.5"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 5v14m-7-7h14"
                                />
                            </svg>
                        </a>

                    </div>

                    <!-- Tabela de lotes -->
                    <div class="w-full overflow-x-auto">

                        <table class="w-full min-w-[1100px] border-collapse text-left text-xs text-text">

                            <!-- Cabeçalho da tabela -->
                            <thead>

                                <tr class="border-b border-gray-400 text-text-secondary">

                                    <th class="px-3 py-2 font-medium">
                                        Código
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Produto
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Qtd. inicial
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Qtd. disponível
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Custo de aquisição
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Entrada
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Validade
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Status
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Ações
                                    </th>

                                </tr>

                            </thead>

                            <!-- Os lotes são carregados pelo JavaScript -->
                            <tbody id="tabelaLotes">

                                <tr>
                                    <td
                                        colspan="9"
                                        class="px-3 py-6 text-center text-text-secondary"
                                    >
                                        Carregando lotes...
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                    <!-- Legenda dos status -->
                    <div class="mt-5 flex justify-end">

                        <div class="flex flex-wrap gap-4 text-[10px] text-text-secondary">

                            <span>Ativo</span>
                            <span>Próx. do vencimento</span>
                            <span>Vencido</span>
                            <span>Esgotado</span>

                        </div>

                    </div>

                </section>

            </div>

        </main>

        <!-- Rodapé -->
        <div id="footer-placeholder"></div>

    </div>

    <!-- Carrega os componentes da página -->
    <script src="../../public/js/load-partials.js"></script>

    <!-- Carrega os lotes do MongoDB -->
    <script src="../../public/js/todos-lotes.js"></script>

</body>

</html>
